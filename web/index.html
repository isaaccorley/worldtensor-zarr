<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WorldTensor</title>
    <meta name="description" content="757 harmonized Earth-system variables streamed straight from GeoZarr on a WebGL globe." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,400;6..144,500;6..144,600&family=Google+Sans+Code:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="progress" id="led" aria-hidden="true"><span></span></div>
    <div class="viewport">
      <div id="map"></div>

      <header class="appbar">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="1.6" />
          <ellipse cx="16" cy="16" rx="6" ry="13" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".7" />
          <path d="M3.5 12h25M3.5 20h25" stroke="currentColor" stroke-width="1.2" opacity=".7" />
        </svg>
        <div>
          <h1>WorldTensor</h1>
          <p id="kicker">Earth system explorer</p>
        </div>
      </header>

      <aside class="panel" id="panel">
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" /></svg>
          <input id="q" type="search" placeholder="Search 757 variables" autocomplete="off" spellcheck="false" />
          <kbd>/</kbd>
        </label>
        <nav class="domains" id="domains"></nav>
        <ul class="vars" id="vars"></ul>
      </aside>

      <section class="title-card" id="title-card">
        <p class="overline" id="var-domain"></p>
        <h2 id="var-title">—</h2>
        <p class="code" id="var-sub"></p>
      </section>

      <footer class="timeline" id="timeline">
        <button class="play" id="play" title="Play / pause (space)" aria-label="Play">
          <svg viewBox="0 0 24 24" class="i-play"><path d="M8 5.14v13.72L19 12z" /></svg>
          <svg viewBox="0 0 24 24" class="i-pause"><path d="M6 5h4v14H6zM14 5h4v14h-4z" /></svg>
        </button>
        <div class="year" id="year">—</div>
        <div class="track">
          <input type="range" id="slider" min="0" max="0" value="0" aria-label="Year" />
          <div class="ticks code" id="ticks"></div>
        </div>
        <div class="segmented speed" id="speed">
          <button data-fps="3">0.5×</button><button data-fps="6" class="is-active">1×</button><button data-fps="14">2×</button>
        </div>
      </footer>

      <aside class="legend" id="legend">
        <div class="legend-head">
          <span id="units"></span>
          <div class="legend-actions">
            <button class="icon-btn" id="auto" title="Reset range to 2nd–98th percentile">
              <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" /></svg>
            </button>
            <button class="icon-btn" id="rev" title="Reverse colormap">
              <svg viewBox="0 0 24 24"><path d="M6.99 11 3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z" /></svg>
            </button>
            <button class="icon-btn" id="ramp-btn" title="Colormap">
              <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0 0 18c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.24 5-5 0-4.42-4.03-8-9-8zm-5.5 9a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3-4a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm3 4a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z" /></svg>
            </button>
          </div>
        </div>
        <button class="ramp" id="ramp" title="Change colormap"></button>
        <div class="colorbar-ticks code" id="cbar-ticks"></div>
        <div class="scale code">
          <input id="vmin" inputmode="decimal" aria-label="Minimum" />
          <input type="range" id="opacity" min="0.2" max="1" step="0.05" value="0.95" title="Opacity" aria-label="Opacity" />
          <input id="vmax" inputmode="decimal" aria-label="Maximum" />
        </div>
        <div class="cmap-grid" id="cmap-grid" hidden></div>
      </aside>

      <aside class="inspector" id="inspector" hidden>
        <div class="ins-head">
          <div>
            <p class="overline">Time series</p>
            <span class="code" id="ins-coord"></span>
          </div>
          <button class="icon-btn" id="ins-close" aria-label="Close">
            <svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" /></svg>
          </button>
        </div>
        <div class="ins-value"><span id="ins-now"></span><span class="code" id="ins-units"></span></div>
        <div class="ins-trend code" id="ins-trend"></div>
        <div class="ins-chart" id="ins-chart"></div>
        <div class="ins-axis code"><span id="ins-y0"></span><span id="ins-y1"></span></div>
      </aside>

      <div class="readout code" id="readout" hidden></div>
      <div class="boot" id="boot"><span id="boot-msg">Loading catalog</span></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
